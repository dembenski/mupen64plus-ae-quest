# Publish Vapor64 VR v0.1.2 release (temporary — DELETE after the release is live)
#
# Fill in RUN_ID and SHA from the green "M64Plus Quest" build run on master
# BEFORE committing this file. Delete this workflow right after the release
# is verified, the same way the v0.1.0 one was deleted (commit 0338e35).
name: Publish Vapor64 VR v0.1.2 release (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        env:
          GH_TOKEN: ${{ github.token}}
          GH_REPO: dembenski/mupen64plus-ae-quest
        run: |
          gh api repos/dembenski/mupen64plus-ae-quest/actions/runs/42492946551/artifacts --jq '.artifacts[] | "\(.id) \(.name) expired=\(.expired)"'
          ARTIFACT_ID=$(gh api repos/dembenski/mupen64plus-ae-quest/actions/runs/42492946551/artifacts --jq '.artifacts[] | select(.name=="mupen64plus-ae-master-f388e45") |.id')
          test -n "$ARTIFACT_ID"
          echo "Artifact ID: $ARTIFACT_ID"
          gh api repos/dembenski/mupen64plus-ae-quest/actions/artifacts/${ARTIFACT_ID}/zip > artifact.zip
          ls -lh artifact.zip
          mkdir -p artifact
          unzip -o artifact.zip -d artifact
          ls -lhR artifact
      - name: Locate APK
        run: |
          APK=$(find artifact -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK"./Mupen64PlusAE-release.apk
          ls -lh Mupen64PlusAE-release.apk
      - name: Create and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          target_commitish: master
          name: Vapor64 VR v0.1.2 — AR mode
          body: |
            Vapor64 VR v0.1.2 — the standalone N64-in-VR Quest app, forked from Mupen64Plus-AE Quest, with hand tracking and AR mode added.

            NEW IN v0.1.2: AR mode. Open the library, tap "AR mode" in the rail, and switch it on — games open on a floating screen in your room, with your room visible around it. Place the screen anywhere: VR menu, Adjust screen, hold a grip to move it, move your palm up or down to resize it. Works with hands only, no controller needed. Controllers still work when picked up.

            BRING YOUR OWN ROMS — no games are included. Sideload the APK on Quest, then load your own legally-dumped N64 ROMs.

            Hand tracking and AR mode are experimental. Please report problems at https://github.com/dembenski/mupen64plus-ae-quest/issues
          files: Mupen64PlusAE-release.apk
          draft: false
          prerelease: false
