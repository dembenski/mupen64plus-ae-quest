# Publish Vapor64 VR v0.1.4 release (temporary — DELETE after the release is live)
#
# Fill in 42527911037 and SHA from the green "M64Plus Quest" build run on master
# BEFORE committing this file. Delete this workflow right after the release
# is verified, the same way the v0.1.0 one was deleted (commit 0338e35).
name: Publish Vapor64 VR v0.1.4 release (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dembenski/mupen64plus-ae-quest
        run: |
          gh api repos/dembenski/mupen64plus-ae-quest/actions/runs/42527911037/artifacts --jq '.artifacts[] | "\(.id) \(.name) expired=\(.expired)"'
          ARTIFACT_ID=$(gh api repos/dembenski/mupen64plus-ae-quest/actions/runs/42527911037/artifacts --jq '.artifacts[] | select(.name=="mupen64plus-ae-master-d9626d7") | .id')
          test -n "$ARTIFACT_ID"
          echo "Artifact ID: $ARTIFACT_ID"
          gh api repos/dembenski/mupen64plus-ae-quest/actions/artifacts/${ARTIFACT_ID}/zip > artifact.zip
          ls -lh artifact.zip
          mkdir -p artifact
          unzip -o artifact.zip -d artifact
          ls -lhR artifact
      - name: Locate APK
        run: |
          APK=$(find artifact -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" ./Mupen64PlusAE-release.apk
          ls -lh Mupen64PlusAE-release.apk
      - name: Create and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.4
          target_commitish: master
          name: Vapor64 VR v0.1.4 — Bluetooth keyboard map
          body: |
            Vapor64 VR v0.1.4 — the standalone N64-in-VR Quest app, forked from Mupen64Plus-AE Quest, with hand tracking, AR mode, and a pick-up-able digital controller added.

            NEW IN v0.1.4: the Bluetooth keyboard map. Pair a Bluetooth keyboard to the Quest and it just works as a controller — no setup, no manual mapping. Left hand: W A S D is the stick, Q is L, E is R. Right hand: arrow keys are the C-buttons, I J K L is the D-pad, U is A, O is B, Space is Z, Enter is Start. While you hold a key, the keyboard owns player 1 and your hands pause; put the keyboard down and your hands take over again. Hand gestures stays the default and is never removed, and the digital controller mode and AR mode keep working. Turn the map off in the library's Keyboard section or the VR menu's Keyboard map item — it takes effect the next game you start. The map fills in when your player 1 profile is one of the built-in profiles and no gamepad is connected; if you mapped keys yourself in your own profile, yours win.
            BRING YOUR OWN ROMS — no games are included. Sideload the APK on Quest, then load your own legally-dumped N64 ROMs.

            Hand tracking, AR mode, and the digital controller are experimental. Please report problems at https://github.com/dembenski/mupen64plus-ae-quest/issues
          files: Mupen64PlusAE-release.apk
          draft: false
          prerelease: false
