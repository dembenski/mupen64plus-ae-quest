# Publish Vapor64 VR v0.1.3 release (temporary — DELETE after the release is live)
#
# Fill in RUN_ID and SHA from the green "M64Plus Quest" build run on master
# BEFORE committing this file. Delete this workflow right after the release
# is verified, the same way the v0.1.0 one was deleted (commit 0338e35).
name: Publish Vapor64 VR v0.1.3 release (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dembenski/mupen64plus-ae-quest
        run: |
          gh api repos/dembenski/mupen64plus-ae-quest/actions/runs/42514922000/artifacts --jq '.artifacts[] | "\(.id) \(.name) expired=\(.expired)"'
          ARTIFACT_ID=$(gh api repos/dembenski/mupen64plus-ae-quest/actions/runs/42514922000/artifacts --jq '.artifacts[] | select(.name=="mupen64plus-ae-master-d188e85") | .id')
          test -n "$ARTIFACT_ID"
          echo "Artifact ID: $ARTIFACT_ID"
          gh api repos/dembenski/mupen64plus-ae-quest/actions/artifacts/${ARTIFACT_ID}/zip > artifact.zip
          ls -lh artifact.zip
          mkdir -p artifact
          unzip -o artifact.zip -d artifact
          ls -lhR artifact
      - name: Locate APK
        run: |
          APK=$(find artifact -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" ./Mupen64PlusAE-release.apk
          ls -lh Mupen64PlusAE-release.apk
      - name: Create and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          target_commitish: master
          name: Vapor64 VR v0.1.3 — Digital controller
          body: |
            Vapor64 VR v0.1.3 — the standalone N64-in-VR Quest app, forked from Mupen64Plus-AE Quest, with hand tracking, AR mode, and a pick-up-able digital controller added.

            NEW IN v0.1.3: the digital controller. A 3D N64 controller you can pick up with your hands, hold while you play, and press like a real one — thumb on the stick, fingers on A, B, Start, the C-buttons, L, R, Z and the D-pad. Its buttons glow and its stick tilts as you play, so you can see what you press. Two hand-tracking modes, and the main one is never removed: Hand gestures (left palm is the stick, pinches are the buttons) stays the default, and the digital controller is the second mode. Switching is one tap: in a game, open the VR menu and tap Hand mode, or in the library tap the Digital controller section's Hand mode tile. To pick the controller up, reach for it and hold a grip — left middle-finger pinch, or a right fist. Open your hand to put it down; the spot is saved. To move it to a new home spot, use the VR menu's Place controller. Works with hands only, no controller needed — one hand is enough to play. Controllers still work when picked up.

            BRING YOUR OWN ROMS — no games are included. Sideload the APK on Quest, then load your own legally-dumped N64 ROMs.

            Hand tracking, AR mode, and the digital controller are experimental. Please report problems at https://github.com/dembenski/mupen64plus-ae-quest/issues
          files: Mupen64PlusAE-release.apk
          draft: false
          prerelease: false
